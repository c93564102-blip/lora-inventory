<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORA - نظام إدارة المخزون السحابي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCefZIo28B7yhL4mEIQcZgumAJictvN1-I",
            authDomain: "lora-inventory-85f26.firebaseapp.com",
            databaseURL: "https://lora-inventory-85f26-default-rtdb.firebaseio.com",
            projectId: "lora-inventory-85f26",
            storageBucket: "lora-inventory-85f26.firebasestorage.app",
            messagingSenderId: "525594981482",
            appId: "1:525594981482:web:6f1afb43785df642084613",
            measurementId: "G-5NDWCBNHB5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.firebaseAuth = { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut };
        window.firebaseDb = { db, ref, set, get, update, remove, onValue };
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <div id="app" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">LORA - نظام إدارة المخزون</h1>
            
            <!-- شاشة تسجيل الدخول -->
            <div id="login-container">
                <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-3 mb-4 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-3 mb-4 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-semibold hover:bg-indigo-700 transition">تسجيل الدخول</button>
            </div>

            <!-- لوحة التحكم -->
            <div id="dashboard" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <span id="user-role-badge" class="px-3 py-1 text-xs rounded-full font-bold"></span>
                    <span id="user-email-display" class="text-sm text-gray-500"></span>
                </div>

                <div class="p-4 bg-gray-50 rounded-xl mb-4 border border-gray-200">
                    <p class="text-gray-700 font-medium mb-2">حالة النظام: متصل بالسحابة 🟢</p>
                    
                    <!-- أزرار تتحكم فيها الصلاحيات -->
                    <div id="admin-controls" class="hidden space-y-2 mt-4 pt-4 border-t border-gray-200">
                        <p class="text-xs text-indigo-600 font-bold mb-1">لوحة تحكم المدير (صلاحيات كاملة):</p>
                        <button onclick="alert('تم تنفيذ إجراء إداري (حذف/تعديل)')" class="w-full bg-red-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-red-700 transition">إدارة وحذف الحركات</button>
                    </div>

                    <div id="employee-controls" class="hidden mt-4 pt-4 border-t border-gray-200">
                        <p class="text-xs text-gray-500">مرحباً بك، يمكنك إدخال البيانات المعتمدة فقط.</p>
                    </div>
                </div>

                <button onclick="handleLogout()" class="w-full bg-gray-600 text-white p-3 rounded-xl font-semibold hover:bg-gray-700 transition">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            if (window.firebaseAuth) {
                const { auth, signInWithEmailAndPassword, onAuthStateChanged, signOut } = window.firebaseAuth;
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.getElementById('login-container').classList.add('hidden');
                        document.getElementById('dashboard').classList.remove('hidden');
                        document.getElementById('user-email-display').innerText = user.email;

                        // التحقق من الصلاحيات بناءً على الإيميل
                        const adminControls = document.getElementById('admin-controls');
                        const employeeControls = document.getElementById('employee-controls');
                        const roleBadge = document.getElementById('user-role-badge');

                        if (user.email === 'admin@lora.com') {
                            // صلاحيات المدير الكاملة
                            adminControls.classList.remove('hidden');
                            employeeControls.classList.add('hidden');
                            roleBadge.innerText = 'مدير النظام (Admin)';
                            roleBadge.className = 'px-3 py-1 text-xs rounded-full font-bold bg-purple-100 text-purple-700';
                        } else {
                            // صلاحيات الموظف العادي
                            adminControls.classList.add('hidden');
                            employeeControls.classList.remove('hidden');
                            roleBadge.innerText = 'موظف (Employee)';
                            roleBadge.className = 'px-3 py-1 text-xs rounded-full font-bold bg-blue-100 text-blue-700';
                        }
                    } else {
                        document.getElementById('login-container').classList.remove('hidden');
                        document.getElementById('dashboard').classList.add('hidden');
                    }
                });

                window.handleLogin = function() {
                    const email = document.getElementById('email').value;
                    const pass = document.getElementById('password').value;
                    signInWithEmailAndPassword(auth, email, pass).catch(err => alert("خطأ في تسجيل الدخول: " + err.message));
                }

                window.handleLogout = function() {
                    signOut(auth);
                }
            }
        }, 1000);
    </script>
</body>
</html>
