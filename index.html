<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة هاشم ابراهيم الشاوي التجارية - نظام إدارة المخزون السحابي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCefZIo28B7yhL4mEIQcZgumAJictvN1-I",
            authDomain: "lora-inventory-85f26.firebaseapp.com",
            databaseURL: "https://lora-inventory-85f26-default-rtdb.firebaseio.com",
            projectId: "lora-inventory-85f26",
            storageBucket: "lora-inventory-85f26.firebasestorage.app",
            messagingSenderId: "525594981482",
            appId: "1:525594981482:web:6f1afb43785df642084613",
            measurementId: "G-5NDWCBNHB5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.firebaseAuth = { auth, signInWithEmailAndPassword, onAuthStateChanged, signOut };
        window.firebaseDb = { db, ref, set, get, update, remove, onValue, push };
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 text-center">
            <h2 class="text-xs font-bold text-gray-400 mb-1">شركة هاشم ابراهيم الشاوي التجارية</h2>
            <h1 class="text-2xl font-bold text-gray-800 mb-6">نظام إدارة المخزون</h1>
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-3 mb-4 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-3 mb-4 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-semibold hover:bg-indigo-700 transition">تسجيل الدخول</button>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboard" class="hidden min-h-screen p-4 md:p-8 max-w-6xl mx-auto">
        <!-- الهيدر -->
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-xs text-indigo-600 font-bold">شركة هاشم ابراهيم الشاوي التجارية</span>
                <h1 class="text-xl font-bold text-gray-800">نظام إدارة المخزون والوارد والمنصرف</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <span id="user-email-display" class="block text-sm font-semibold text-gray-700"></span>
                    <span id="user-role-badge" class="px-2 py-0.5 text-xs rounded-full font-bold"></span>
                </div>
                <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-red-100 transition">تسجيل الخروج</button>
            </div>
        </div>

        <!-- قسم إضافة حركة وارد أو منصرف (متاح للجميع أو حسب الصلاحية) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">تسجيل حركة مخزنية جديدة (وارد / منصرف / استهلاك)</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="item-name" placeholder="اسم الصنف / المنتج" class="p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                <select id="movement-type" class="p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="وارد">وارد للمخزن</option>
                    <option value="منصرف">منصرف من المخزن</option>
                    <option value="استهلاك">استهلاك / إطفاء</option>
                </select>
                <input type="number" id="item-qty" placeholder="الكمية" class="p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addMovement()" class="bg-indigo-600 text-white p-3 rounded-xl font-semibold hover:bg-indigo-700 transition">إضافة الحركة</button>
            </div>
        </div>

        <!-- جدول الحركات -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-lg font-bold text-gray-800 mb-4">سجل الحركات السحابية اللحظية</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 border-b">
                            <th class="p-3">اسم الصنف</th>
                            <th class="p-3">نوع الحركة</th>
                            <th class="p-3">الكمية</th>
                            <th class="p-3">المستخدم المسؤول</th>
                            <th id="th-action" class="p-3 hidden">الإجراءات الإدارية</th>
                        </tr>
                    </thead>
                    <tbody id="movements-table-body">
                        <!-- يتم جلب البيانات لحظياً من قاعدة البيانات -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            if (window.firebaseAuth && window.firebaseDb) {
                const { auth, signInWithEmailAndPassword, onAuthStateChanged, signOut } = window.firebaseAuth;
                const { db, ref, push, onValue, remove } = window.firebaseDb;
                
                let currentUserEmail = "";

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUserEmail = user.email;
                        document.getElementById('login-container').classList.add('hidden');
                        document.getElementById('dashboard').classList.remove('hidden');
                        document.getElementById('user-email-display').innerText = user.email;

                        const roleBadge = document.getElementById('user-role-badge');
                        const thAction = document.getElementById('th-action');

                        if (user.email === 'admin@lora.com') {
                            roleBadge.innerText = 'مدير النظام (Admin)';
                            roleBadge.className = 'px-2 py-0.5 text-xs rounded-full font-bold bg-purple-100 text-purple-700';
                            thAction.classList.remove('hidden');
                        } else {
                            roleBadge.innerText = 'موظف (Employee)';
                            roleBadge.className = 'px-2 py-0.5 text-xs rounded-full font-bold bg-blue-100 text-blue-700';
                            thAction.classList.add('hidden');
                        }

                        loadMovements(user.email === 'admin@lora.com');
                    } else {
                        document.getElementById('login-container').classList.remove('hidden');
                        document.getElementById('dashboard').classList.add('hidden');
                    }
                });

                window.handleLogin = function() {
                    const email = document.getElementById('email').value;
                    const pass = document.getElementById('password').value;
                    signInWithEmailAndPassword(auth, email, pass).catch(err => alert("خطأ في تسجيل الدخول: " + err.message));
                }

                window.handleLogout = function() {
                    signOut(auth);
                }

                window.addMovement = function() {
                    const name = document.getElementById('item-name').value;
                    const type = document.getElementById('movement-type').value;
                    const qty = document.getElementById('item-qty').value;

                    if (!name || !qty) {
                        alert("الرجاء إدخال اسم الصنف والكمية بشكل صحيح.");
                        return;
                    }

                    const movementsRef = ref(db, 'movements');
                    push(movementsRef, {
                        name: name,
                        type: type,
                        qty: Number(qty),
                        user: currentUserEmail,
                        date: new Date().toLocaleDateString('ar-EG')
                    }).then(() => {
                        document.getElementById('item-name').value = '';
                        document.getElementById('item-qty').value = '';
                    }).catch(err => alert("خطأ أثناء الحفظ: " + err.message));
                }

                function loadMovements(isAdmin) {
                    const movementsRef = ref(db, 'movements');
                    onValue(movementsRef, (snapshot) => {
                        const tbody = document.getElementById('movements-table-body');
                        tbody.innerHTML = '';
                        
                        const data = snapshot.val();
                        if (data) {
                            Object.keys(data).forEach((key) => {
                                const item = data[key];
                                let row = `<tr class="border-b hover:bg-gray-50">
                                    <td class="p-3">${item.name}</td>
                                    <td class="p-3"><span class="px-2 py-1 rounded text-xs font-bold ${item.type === 'وارد' ? 'bg-green-100 text-green-700' : item.type === 'منصرف' ? 'bg-orange-100 text-orange-700' : 'bg-red-100 text-red-700'}">${item.type}</span></td>
                                    <td class="p-3">${item.qty}</td>
                                    <td class="p-3 text-sm text-gray-500">${item.user}</td>`;
                                
                                if (isAdmin) {
                                    row += `<td class="p-3"><button onclick="deleteMovement('${key}')" class="bg-red-500 text-white px-3 py-1 rounded-lg text-xs hover:bg-red-600">حذف</button></td>`;
                                }
                                row += `</tr>`;
                                tbody.innerHTML += row;
                            });
                        }
                    });
                }

                window.deleteMovement = function(key) {
                    if (confirm("هل أنت متأكد من حذف هذه الحركة نهائياً؟")) {
                        const itemRef = ref(db, 'movements/' + key);
                        remove(itemRef);
                    }
                }
            }
        }, 1000);
    </script>
</body>
</html>
