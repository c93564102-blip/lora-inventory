<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORA شركة هاشم ابراهيم الشاوي التجارية - نظام إدارة مخزون</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header / Navbar -->
    <div class="bg-white rounded-xl shadow-sm p-4 mb-6 flex justify-between items-center border border-gray-100">
        <div class="flex items-center gap-4">
            <div class="text-right">
                <p class="text-xs text-gray-500 font-bold">شركة هاشم ابراهيم الشاوي التجارية</p>
                <h1 class="text-xl font-extrabold text-gray-800">النظام الموحد لإدارة المخزون (ERP)</h1>
            </div>
            <div class="text-2xl font-black text-gray-300 ml-4 border-r pr-4">L O R A</div>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-left bg-purple-50 p-2 rounded-lg border border-purple-100">
                <p class="text-sm font-bold text-gray-800">admin@lora.com</p>
                <p class="text-xs font-bold text-purple-600 bg-purple-200 inline-block px-2 rounded-full mt-1">مدير النظام (ADMIN)</p>
            </div>
            <button id="logoutBtn" class="border border-red-200 text-red-500 hover:bg-red-50 px-4 py-2 rounded-lg font-bold transition text-sm">خروج</button>
        </div>
    </div>

    <!-- Add Transaction Section -->
    <div class="bg-white rounded-xl shadow-sm p-6 mb-6 border border-gray-100">
        <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-slate-800"></span>
            إضافة حركة مخزنية جديدة (منتجات / زيوت / تغليف)
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
            <!-- Category -->
            <select id="itemCategory" class="border border-gray-200 rounded-lg p-3 outline-none focus:border-slate-800 bg-gray-50">
                <option value="زيوت عطرية / أساسية">🧪 زيوت عطرية / أساسية</option>
                <option value="مواد تغليف وتعبئة">📦 مواد تغليف وتعبئة</option>
                <option value="منتج نهائي">🧴 منتج نهائي</option>
            </select>

            <!-- Item Name -->
            <input type="text" id="itemName" placeholder="اسم الصنف (مثال: سيروم، زيت...)" class="border border-gray-200 rounded-lg p-3 outline-none focus:border-slate-800 bg-gray-50">

            <!-- Transaction Type -->
            <select id="moveType" class="border border-gray-200 rounded-lg p-3 outline-none focus:border-slate-800 bg-gray-50 text-green-700 font-bold">
                <option value="وارد للمخزن">📥 وارد للمخزن</option>
                <option value="منصرف من المخزن">📤 منصرف من المخزن</option>
            </select>

            <!-- Quantity -->
            <input type="number" id="itemQty" placeholder="الكمية" class="border border-gray-200 rounded-lg p-3 outline-none focus:border-slate-800 bg-gray-50">

            <!-- Submit Button -->
            <button id="saveBtn" class="bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg p-3 transition shadow-md">
                حفظ الحركة
            </button>
        </div>
    </div>

    <!-- Live Transactions Table Section -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <h2 class="text-lg font-bold text-gray-800 mb-4">سجل العمليات السحابية اللحظية</h2>
        
        <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 text-sm">
                        <th class="p-3 rounded-r-lg">التصنيف</th>
                        <th class="p-3">اسم الصنف</th>
                        <th class="p-3">نوع الحركة</th>
                        <th class="p-3">الكمية</th>
                        <th class="p-3">التاريخ</th>
                        <th class="p-3">المسؤول</th>
                        <th class="p-3 rounded-l-lg">إجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be injected here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // إعدادات قاعدة بياناتك (نفس الإعدادات الخاصة بك)
        const firebaseConfig = {
            apiKey: "AIzaSyCefZIo28B7yhL4mEIQcZgumAJictvN1-I",
            authDomain: "lora-inventory-85f26.firebaseapp.com",
            databaseURL: "https://lora-inventory-85f26-default-rtdb.firebaseio.com",
            projectId: "lora-inventory-85f26",
            storageBucket: "lora-inventory-85f26.firebasestorage.app",
            messagingSenderId: "525594981482"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // مرجع قاعدة البيانات الخاص بالحركات
        const transactionsRef = ref(db, 'inventory_transactions');

        // دالة حفظ حركة جديدة
        document.getElementById('saveBtn').addEventListener('click', () => {
            const category = document.getElementById('itemCategory').value;
            const name = document.getElementById('itemName').value;
            const type = document.getElementById('moveType').value;
            const qty = document.getElementById('itemQty').value;
            
            if (!name || !qty) {
                alert("برجاء إدخال اسم الصنف والكمية!");
                return;
            }

            const now = new Date();
            const dateString = now.toLocaleDateString('ar-EG') + ' - ' + now.toLocaleTimeString('ar-EG');

            // إرسال البيانات للفايربيس
            push(transactionsRef, {
                category: category,
                itemName: name,
                moveType: type,
                quantity: qty,
                date: dateString,
                user: "admin@lora.com"
            }).then(() => {
                // تصفير الخانات بعد الحفظ
                document.getElementById('itemName').value = '';
                document.getElementById('itemQty').value = '';
            }).catch((error) => {
                alert("حدث خطأ أثناء الحفظ: " + error);
            });
        });

        // دالة قراءة البيانات وعرضها في الجدول لحظياً
        onValue(transactionsRef, (snapshot) => {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = ''; // تفريغ الجدول قبل إعادة الملء
            
            snapshot.forEach((childSnapshot) => {
                const childKey = childSnapshot.key;
                const childData = childSnapshot.val();

                // تحديد لون الحركة (أخضر للوارد، أحمر للمنصرف)
                const typeColor = childData.moveType.includes("وارد") ? "text-green-600 bg-green-50" : "text-red-600 bg-red-50";

                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-50 hover:bg-gray-50 transition";
                
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-sm">${childData.category}</td>
                    <td class="p-3 font-bold text-slate-800">${childData.itemName}</td>
                    <td class="p-3">
                        <span class="px-2 py-1 rounded-md text-xs font-bold ${typeColor}">
                            ${childData.moveType}
                        </span>
                    </td>
                    <td class="p-3 font-bold text-lg">${childData.quantity}</td>
                    <td class="p-3 text-xs text-gray-500" dir="ltr">${childData.date}</td>
                    <td class="p-3 text-xs font-bold text-gray-500">${childData.user}</td>
                    <td class="p-3">
                        <button onclick="deleteRow('${childKey}')" class="text-red-400 hover:text-red-600 font-bold text-xs bg-white border border-red-100 hover:bg-red-50 px-2 py-1 rounded">حذف</button>
                    </td>
                `;
                // إضافة الصف في بداية الجدول لتظهر الحركات الجديدة أولاً
                tableBody.prepend(tr);
            });
        });

        // دالة الحذف (متاحة في بيئة الـ window لتعمل مع onclick)
        window.deleteRow = function(key) {
            if(confirm("هل أنت متأكد من حذف هذه الحركة؟")) {
                remove(ref(db, 'inventory_transactions/' + key));
            }
        };
    </script>
</body>
</html>
