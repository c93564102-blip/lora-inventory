<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة هاشم ابراهيم الشاوي التجارية - نظام إدارة مخزون LORA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCefZIo28B7yhL4mEIQcZgumAJictvN1-I",
            authDomain: "lora-inventory-85f26.firebaseapp.com",
            databaseURL: "https://lora-inventory-85f26-default-rtdb.firebaseio.com",
            projectId: "lora-inventory-85f26",
            storageBucket: "lora-inventory-85f26.firebasestorage.app",
            messagingSenderId: "525594981482",
            appId: "1:525594981482:web:6f1afb43785df642084613"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.firebaseAuth = { auth, signInWithEmailAndPassword, onAuthStateChanged, signOut };
        window.firebaseDb = { db, ref, push, onValue, remove };
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
        select { direction: rtl; text-align: right; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-gray-100 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gray-900"></div>
            
            <img src="logo.jpeg" alt="LORA Logo" class="h-20 mx-auto mb-3 object-contain">
            <h2 class="text-xs font-bold text-gray-400 tracking-widest mb-6">شركة هاشم ابراهيم الشاوي التجارية</h2>
            
            <div class="space-y-4 mb-6">
                <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-gray-900 font-medium text-gray-700">
                <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-gray-900 font-medium text-gray-700">
            </div>
            <button onclick="handleLogin()" class="w-full bg-gray-900 hover:bg-gray-800 text-white p-4 rounded-2xl font-bold text-lg transition shadow-lg">تسجيل الدخول</button>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard" class="hidden min-h-screen p-4 md:p-8 max-w-7xl mx-auto">
        <!-- الهيدر -->
        <div class="glass-card p-6 rounded-3xl shadow-lg border border-gray-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <img src="logo.jpeg" alt="LORA Logo" class="h-14 w-auto object-contain">
                <div class="border-r-2 border-gray-200 pr-5">
                    <span class="text-xs text-gray-400 font-bold tracking-widest block mb-1">شركة هاشم ابراهيم الشاوي التجارية</span>
                    <h1 class="text-xl font-black text-gray-900">النظام الموحد لإدارة المخزون (ERP)</h1>
                </div>
            </div>
            <div class="flex items-center gap-4 bg-gray-50 p-2 pl-4 rounded-2xl border border-gray-100">
                <div class="text-left md:text-right">
                    <span id="user-email-display" class="block text-sm font-bold text-gray-800"></span>
                    <span id="user-role-badge" class="px-3 py-0.5 mt-1 inline-block text-[10px] rounded-full font-black uppercase tracking-wider"></span>
                </div>
                <button onclick="handleLogout()" class="bg-red-50 text-red-600 border border-red-100 p-2.5 rounded-xl hover:bg-red-500 hover:text-white transition" title="تسجيل الخروج">خروج</button>
            </div>
        </div>

        <!-- قسم الإدخال -->
        <div class="glass-card p-8 rounded-3xl shadow-lg border border-gray-200 mb-8">
            <h2 class="text-lg font-black text-gray-900 mb-6 flex items-center gap-2">
                <div class="w-3 h-3 bg-gray-900 rounded-sm transform rotate-45"></div>
                إضافة حركة مخزنية جديدة
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <select id="item-category" class="p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none font-semibold text-gray-700">
                    <option value="منتجات نهائية">📦 منتجات نهائية</option>
                    <option value="زيوت عطرية وأساسية">🧪 زيوت عطرية وأساسية</option>
                    <option value="مواد تغليف وتعبئة">🏷️ مواد تغليف وتعبئة</option>
                </select>
                <input type="text" id="item-name" placeholder="اسم الصنف (مثال: سيروم، زيت لافندر)" class="p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none font-semibold text-gray-700">
                <select id="movement-type" class="p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none font-semibold text-gray-700">
                    <option value="وارد للمخزن">🟢 وارد للمخزن</option>
                    <option value="منصرف للإنتاج">🟠 منصرف للإنتاج</option>
                    <option value="استهلاك وإطفاء">🔴 استهلاك وإطفاء</option>
                </select>
                <input type="number" id="item-qty" placeholder="الكمية" class="p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none font-semibold text-gray-700">
            </div>
            <div class="mt-4 text-left">
                <button onclick="addMovement()" class="bg-gray-900 hover:bg-gray-800 text-white px-8 py-4 rounded-2xl font-bold transition shadow-md w-full md:w-auto">حفظ الحركة في السستم</button>
            </div>
        </div>

        <!-- جدول الحركات -->
        <div class="glass-card p-8 rounded-3xl shadow-lg border border-gray-200">
            <h2 class="text-lg font-black text-gray-900 mb-6">سجل العمليات السحابية اللحظية</h2>
            <div class="overflow-x-auto rounded-2xl border border-gray-100">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-sm">
                            <th class="p-4 font-bold">التصنيف</th>
                            <th class="p-4 font-bold">اسم الصنف</th>
                            <th class="p-4 font-bold">نوع الحركة</th>
                            <th class="p-4 font-bold">الكمية</th>
                            <th class="p-4 font-bold">التاريخ</th>
                            <th class="p-4 font-bold">المسؤول</th>
                            <th id="th-action" class="p-4 font-bold hidden">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="movements-table-body" class="divide-y divide-gray-100 text-sm bg-white">
                        <!-- البيانات تسحب لحظياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            if (window.firebaseAuth && window.firebaseDb) {
                const { auth, signInWithEmailAndPassword, onAuthStateChanged, signOut } = window.firebaseAuth;
                const { db, ref, push, onValue, remove } = window.firebaseDb;
                
                let currentUserEmail = "";

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUserEmail = user.email;
                        document.getElementById('login-container').classList.add('hidden');
                        document.getElementById('dashboard').classList.remove('hidden');
                        document.getElementById('user-email-display').innerText = user.email;

                        const roleBadge = document.getElementById('user-role-badge');
                        const thAction = document.getElementById('th-action');

                        if (user.email === 'admin@lora.com') {
                            roleBadge.innerText = 'مدير النظام (Admin)';
                            roleBadge.className = 'px-3 py-0.5 mt-1 inline-block text-[10px] rounded-full font-black uppercase tracking-wider bg-purple-100 text-purple-700';
                            thAction.classList.remove('hidden');
                        } else {
                            roleBadge.innerText = 'موظف مخزن';
                            roleBadge.className = 'px-3 py-1 mt-1 inline-block text-[10px] rounded-full font-black uppercase tracking-wider bg-blue-100 text-blue-700';
                            thAction.classList.add('hidden');
                        }

                        loadMovements(user.email === 'admin@lora.com');
                    } else {
                        document.getElementById('login-container').classList.remove('hidden');
                        document.getElementById('dashboard').classList.add('hidden');
                    }
                });

                window.handleLogin = function() {
                    const email = document.getElementById('email').value;
                    const pass = document.getElementById('password').value;
                    signInWithEmailAndPassword(auth, email, pass).catch(err => alert("خطأ في تسجيل الدخول: " + err.message));
                }

                window.handleLogout = function() {
                    signOut(auth);
                }

                window.addMovement = function() {
                    const category = document.getElementById('item-category').value;
                    const name = document.getElementById('item-name').value;
                    const type = document.getElementById('movement-type').value;
                    const qty = document.getElementById('item-qty').value;

                    if (!name || !qty) {
                        alert("الرجاء إدخال اسم الصنف والكمية بشكل صحيح.");
                        return;
                    }

                    const movementsRef = ref(db, 'movements');
                    push(movementsRef, {
                        category: category,
                        name: name,
                        type: type,
                        qty: Number(qty),
                        user: currentUserEmail,
                        date: new Date().toLocaleDateString('ar-EG')
                    }).then(() => {
                        document.getElementById('item-name').value = '';
                        document.getElementById('item-qty').value = '';
                        alert("تم حفظ الحركة بنجاح!");
                    }).catch((error) => {
                        alert("حدث خطأ أثناء الحفظ: " + error.message);
                    });
                }

                function loadMovements(isAdmin) {
                    const movementsRef = ref(db, 'movements');
                    onValue(movementsRef, (snapshot) => {
                        const tbody = document.getElementById('movements-table-body');
                        tbody.innerHTML = '';
                        
                        const data = snapshot.val();
                        if (data) {
                            Object.keys(data).reverse().forEach((key) => {
                                const item = data[key];
                                let typeBadge = 'bg-green-50 text-green-700 border-green-200';
                                if(item.type && item.type.includes('منصرف')) typeBadge = 'bg-orange-50 text-orange-700 border-orange-200';
                                if(item.type && (item.type.includes('استهلاك') || item.type.includes('إطفاء'))) typeBadge = 'bg-red-50 text-red-700 border-red-200';

                                let row = `<tr class="hover:bg-gray-50 transition">
                                    <td class="p-4 font-bold text-gray-700">${item.category || '-'}</td>
                                    <td class="p-4 font-black text-gray-900 text-base">${item.name || '-'}</td>
                                    <td class="p-4"><span class="px-3 py-1 border rounded-xl text-xs font-bold ${typeBadge}">${item.type || '-'}</span></td>
                                    <td class="p-4 font-black text-lg text-gray-800">${item.qty || 0}</td>
                                    <td class="p-4 text-gray-500 text-xs">${item.date || '-'}</td>
                                    <td class="p-4 text-gray-400 text-xs">${item.user || '-'}</td>`;
                                
                                if (isAdmin) {
                                    row += `<td class="p-4"><button onclick="deleteMovement('${key}')" class="bg-red-50 text-red-600 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition">حذف</button></td>`;
                                }
                                row += `</tr>`;
                                tbody.innerHTML += row;
                            });
                        }
                    });
                }

                window.deleteMovement = function(key) {
                    if (confirm("هل أنت متأكد من حذف هذه الحركة؟")) {
                        const itemRef = ref(db, 'movements/' + key);
                        remove(itemRef);
                    }
                }
            }
        }, 1000);
    </script>
</body>
</html>
